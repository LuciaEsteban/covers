<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis covers</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9a2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis covers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef1ff; --card:#ffffff; --ink:#2d2a45; --muted:#7a7899; --line:#e3e0f6;
  --accent:#7b6cf0; --accent-ink:#ffffff; --accent-soft:#ebe8ff;
  --blue:#5fa8f0; --blue-ink:#2f6fb0; --blue-soft:#e3f1ff; --blue-line:#cfe6fb;
  --warm:#f7c948; --warm-ink:#8f6a00; --warm-soft:#fff8d9; --warm-line:#ffeaa0;
  --violet:#9060d8; --violet-soft:#f1e9ff; --violet-line:#e0d0fa;
  --danger:#c0392b; --ok:#2e8b57;
  --page:linear-gradient(180deg,#e6efff 0%,#f1eaff 55%,#fff1ee 100%);
  --glass:rgba(255,255,255,.80);
  --shadow:0 1px 3px rgba(80,70,160,.10),0 8px 20px rgba(80,70,160,.07);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#17152b; --card:#232042; --ink:#f0eefb; --muted:#a9a6c9; --line:#37336a;
    --accent:#a79bff; --accent-ink:#17152b; --accent-soft:#322e63;
    --blue:#7fbcf5; --blue-ink:#a9d3fa; --blue-soft:#1f3350; --blue-line:#2c4a73;
    --warm:#ffd966; --warm-ink:#ffe48f; --warm-soft:#38331d; --warm-line:#5a5028;
    --violet:#c0a0f5; --violet-soft:#2e2552; --violet-line:#463a7a;
    --danger:#ff9a8f; --ok:#7bd88f;
    --page:linear-gradient(180deg,#15152b 0%,#1c1840 60%,#251a33 100%);
    --glass:rgba(35,32,66,.78);
    --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{touch-action:manipulation}
.card,.chip,.btn,nav.tabs button,.fab,.tagchip,a.linkbtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
.hidden{display:none!important}

/* layout */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:760px;margin:0 auto}
header.top{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;background:var(--bg);background-image:var(--page);background-attachment:fixed;position:sticky;top:0;z-index:5}
header.top h1{margin:0 0 8px;font-size:26px;letter-spacing:-.3px;background:linear-gradient(90deg,#4f9cf0,#8a63e0 55%,#e58bc4);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;min-height:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sort{min-height:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;max-width:118px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:38px;font-size:14px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#6fb3f2,#9a7ae8);color:#fff;border-color:transparent}
#statusChips .chip.on{background:linear-gradient(135deg,#ffeb85,#ffd24d);color:#5a4300}
#statusChips .chip{border-color:var(--warm-line)}
.chip.tag{font-size:13px;padding:6px 12px;min-height:34px;background:transparent}
.chip.tag{border-color:var(--blue-line);color:var(--blue-ink)}
.chip.tag.on{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(150px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;min-height:56px;padding:8px 2px 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}
.fab{background:linear-gradient(135deg,#6fb3f2,#9a7ae8)!important;position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;box-shadow:0 6px 18px rgba(60,30,110,.4);z-index:7}

/* cards */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;border-left:6px solid var(--warm-line);margin:10px 0;display:flex;gap:12px;align-items:center;cursor:pointer}
.cover{width:64px;height:64px;border-radius:12px;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(45,42,69,.75);font-weight:700;font-size:24px}
.cover.big{width:100px;height:100px;font-size:36px;border-radius:16px}
.card .body{flex:1;min-width:0}
.card .t{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.pill.fmt{background:var(--violet-soft);color:var(--violet)}
.pill.pr-Alta{background:#ffc9b8;color:#8a2e12}.pill.pr-Media{background:#ffe38a;color:#6b4a00}.pill.pr-Baja{background:#ffefd0;color:#8a5a14}
.st0{background:#fff0a8;color:#6b5400}.st1{background:#ffe0a3;color:#7a4a00}.st2{background:#ffcf9e;color:#8a3f00}
.st3{background:#ffbfa6;color:#8a2b10}.st4{background:#d0f0d8;color:#1d6b3a}.st5{background:#a8e6bd;color:#0f5128}.st6{background:#e4e3f1;color:#5b5a78}
.bar{height:8px;border-radius:5px;background:var(--warm-soft);box-shadow:inset 0 0 0 1px var(--warm-line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ffe97a,#ffc93c)}
.stale{outline:2px solid #ff9f8f;outline-offset:-2px}
.stale-tag{font-size:12px;color:var(--danger);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.banner{background:var(--warm-soft);color:var(--warm-ink);border:1px solid var(--warm-line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner button{border:0;background:linear-gradient(135deg,#ffeb85,#ffd24d);color:#5a4300;border-radius:8px;padding:6px 10px;font-size:13px}

/* sheets */
.overlay{position:fixed;inset:0;height:100dvh;background:var(--bg);background-image:var(--page);z-index:20;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.overlay>.bar-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.overlay>.bar-top h2{margin:0;font-size:17px}
.overlay>.content{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-padding-bottom:140px;padding:16px 16px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:12px;padding:10px 16px;background:linear-gradient(135deg,#6fb3f2,#9a7ae8);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px;border-radius:10px}
label.f{display:block;margin:14px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea.in{min-height:88px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.tagbox input{flex:1;min-width:110px;border:0;background:none;outline:none;padding:4px}
.tagchip{background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tagchip button{border:0;background:none;color:var(--blue-ink);font-size:16px;padding:0 2px}
.rng{width:100%;height:36px;accent-color:#f59a4c}
.quick{display:flex;gap:6px;margin-top:4px}.quick .chip{flex:1;text-align:center;padding:8px 0}
.linkrow{display:grid;grid-template-columns:100px 1fr 44px;gap:6px;margin-bottom:8px}
.filerow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.filerow .n{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .s{color:var(--muted);font-size:12px}
.player{margin:4px 0 10px}
.player audio,.player video{width:100%;border-radius:12px;background:#000}
.player audio{background:transparent}
a.linkbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--violet);border:1px solid var(--violet-line);padding:8px 12px;border-radius:12px;text-decoration:none;font-weight:600;margin:0 8px 8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv span:nth-child(odd){color:var(--muted)}
.notes{white-space:pre-wrap;background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line);font-size:15px}
h3.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 6px}
/* grupos por color */
.grp{border-radius:20px;padding:2px 14px 16px;margin:16px 0}
.grp>h3.sec{margin-top:14px}
.grp.blue{background:var(--blue-soft);border:1px solid var(--blue-line)}.grp.blue>h3.sec{color:var(--blue-ink)}
.grp.warm{background:var(--warm-soft);border:1px solid var(--warm-line)}.grp.warm>h3.sec{color:var(--warm-ink)}
.grp.violet{background:var(--violet-soft);border:1px solid var(--violet-line)}.grp.violet>h3.sec{color:var(--violet)}
.grp.warm .in{border-color:var(--warm-line)}.grp.blue .in{border-color:var(--blue-line)}.grp.violet .in{border-color:var(--violet-line)}
.grp.warm label.f{color:var(--warm-ink)}.grp.blue label.f{color:var(--blue-ink)}.grp.violet label.f{color:var(--violet)}
.grp.warm .chip{border-color:var(--warm-line)}.grp.warm .chip.on{background:linear-gradient(135deg,#ffeb85,#ffd24d);color:#5a4300}
.grp.warm .kv span:nth-child(odd){color:var(--warm-ink)}
.grp.violet .btn.soft{background:#fff;color:var(--violet)}.grp.violet .filerow{border-color:var(--violet-line)}
.grp.violet .btn{background:linear-gradient(135deg,#a98af0,#8a63e0)}.grp.blue .btn.soft{background:#fff;color:var(--blue-ink)}

/* resumen */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.kpi:nth-child(1){background:var(--blue-soft)}.kpi:nth-child(1) b{color:var(--blue-ink)}
.kpi:nth-child(2){background:var(--warm-soft)}.kpi:nth-child(2) b{color:var(--warm-ink)}
.kpi:nth-child(3){background:#ffe6dc}.kpi:nth-child(3) b{color:#b3441f}
.kpi:nth-child(4){background:var(--violet-soft)}.kpi:nth-child(4) b{color:var(--violet)}
.kpi b{display:block;font-size:28px;color:var(--accent)}
.kpi span{color:var(--muted);font-size:13px}
.hrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hrow .l{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .b{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.hrow .b i{display:block;height:100%;background:linear-gradient(90deg,#6fb3f2,#9a7ae8);border-radius:7px}
.panel.warm .hrow .b{background:var(--warm-line)}.panel.warm .hrow .b i{background:linear-gradient(90deg,#ffe97a,#ffc93c)}
.panel.warm{background:var(--warm-soft)}.panel.violet{background:var(--violet-soft)}.panel.blue{background:var(--blue-soft)}
.hrow .v{width:28px;text-align:right;font-weight:600}
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin:12px 0}
.panel h4{margin:0 0 6px;font-size:15px}
.hint{color:var(--muted);font-size:13px}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#8ec2ff,#b9a2f5 55%,#ffc6d9);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{background:var(--card);border-radius:20px;padding:26px 22px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#lock h1{margin:0 0 4px;font-size:28px;background:linear-gradient(90deg,#4f9cf0,#8a63e0);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
#lock p{margin:0 0 14px;color:var(--muted);font-size:14px}
#lock .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:88%;text-align:center}

/* ===== Animaciones ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fabIn{from{opacity:0;transform:scale(.4) rotate(-60deg)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes lockIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-22px)}}
.card{transition:transform .18s ease,box-shadow .2s ease;content-visibility:auto;contain-intrinsic-size:auto 96px}
.card:active{transform:scale(.975)}
.anim .card,.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.anim .card{animation-delay:calc(var(--i,0)*45ms)}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(6){animation-delay:.3s}
.bar>i,.hrow .b i{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
.overlay{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1)}
.overlay .grp{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.overlay .grp:nth-of-type(2){animation-delay:.07s}.overlay .grp:nth-of-type(3){animation-delay:.14s}.overlay .grp:nth-of-type(4){animation-delay:.21s}
.overlay .cover.big{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.chip,.btn,.pill,a.linkbtn{transition:transform .15s ease,background .2s ease,box-shadow .2s ease,color .2s ease}
.chip:active,.btn:active,a.linkbtn:active{transform:scale(.94)}
.chip.on{box-shadow:0 3px 10px rgba(122,108,240,.28)}
#statusChips .chip.on{box-shadow:0 3px 10px rgba(255,160,90,.35)}
.fab{animation:fabIn .6s cubic-bezier(.2,.9,.3,1.2) .2s both;transition:transform .15s ease}
.fab:active{transform:scale(.88) rotate(90deg)}
nav.tabs button{transition:color .2s ease}
nav.tabs button.on .ic{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
#lock::before,#lock::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 12s ease-in-out infinite;pointer-events:none}
#lock::before{width:240px;height:240px;background:#ffd9a8;top:8%;left:-60px}
#lock::after{width:280px;height:280px;background:#a8d4ff;bottom:6%;right:-80px;animation-delay:-6s}
#lock form{position:relative;animation:lockIn .7s cubic-bezier(.2,.8,.2,1) both}
.tagchip{animation:pop .3s ease both}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(123,108,240,.25);border-color:var(--accent)}
.grp.warm input:focus,.grp.warm select:focus{box-shadow:0 0 0 3px rgba(247,201,72,.35);border-color:var(--warm)}

/* ===== Plan y álbumes ===== */
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-h h3{margin:0;font-size:18px}.sec-h span{color:var(--muted);font-size:13px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mini .kpi{padding:12px}.mini .kpi b{font-size:24px}.mini .kpi span{font-size:12px}
.pcard{flex-wrap:wrap;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;gap:10px;align-items:center;margin:8px 0;cursor:pointer;border-left:6px solid var(--warm-line);transition:transform .18s}
.pcard:active{transform:scale(.975)}
.pcard .cover{width:48px;height:48px;font-size:18px;border-radius:10px}
.pcard .body{flex:1;min-width:0}
.pcard .t{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .bar{margin-top:6px;height:6px}
.pcard .pc{font-weight:700;color:var(--warm-ink);font-size:14px;min-width:34px;text-align:right}
.duechip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#fff0a8;color:#6b5400}
.duechip.soon{background:#ffcf9e;color:#8a3f00}.duechip.over{background:#ffc9b8;color:#8a2e12}
.board{scroll-padding-left:16px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{display:none}
.col{flex:none;width:min(80vw,300px);scroll-snap-align:center;background:var(--warm-soft);border:1px solid var(--warm-line);border-radius:20px;padding:10px 10px 4px}
.col h4{margin:2px 4px 6px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.col .cnt{border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.col .pcard{box-shadow:none;flex-wrap:wrap}
.col .empty-col{color:var(--muted);font-size:13px;text-align:center;padding:14px 0 18px}
.adv{flex:1 1 100%;border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;min-height:38px;font-size:13px;font-weight:600}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.tile:active{transform:scale(.97)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:4px;aspect-ratio:1;border-radius:14px;overflow:hidden}

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function fmtSize(n){ if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(0)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function daysAgo(ts){ return Math.floor((Date.now()-ts)/DAY); }
function colorFor(str){
  let h = 0; for(const ch of str||"?") h = (h*31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 60% 74%)`;
}
function coverHtml(song, big){
  const cls = "cover"+(big?" big":"");
  if(song.cover) return `<div class="${cls}" style="background-image:url('${song.cover}')"></div>`;
  const ini = (song.title||"?").trim().charAt(0).toUpperCase() || "?";
  return `<div class="${cls}" style="background:${colorFor(song.title)}">${esc(ini)}</div>`;
}
function normUrl(u){
  u = (u||"").trim(); if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://"+u;
  try{ const x = new URL(u); return (x.protocol==="http:"||x.protocol==="https:") ? x.href : ""; }catch(e){ return ""; }
}
function staleDays(){ const n = parseInt(lsGet("covers.staleDays","30"),10); return n>0? n : 30; }
function isStale(s){ return !DONE.includes(s.status) && s.status!=="En pausa" && (Date.now()-s.updatedAt) > staleDays()*DAY; }

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
const hashCred = (u,p) => sha256(`${APP_SALT}|${u.trim().toLowerCase()}|${p}`);
function currentCred(){
  return { user: lsGet("covers.user", DEFAULT_USER), hash: lsGet("covers.hash", DEFAULT_HASH) };
}
function isUnlocked(){ return ssGet("covers.ok")==="1" || lsGet("covers.remember","")==="1"; }

  $("#lock").classList.add("hidden");

/* ========================= Base de datos (IndexedDB) ========================= */
let _db;
function openDB(){
  return _db || (_db = new Promise((res, rej) => {
    const r = indexedDB.open("covers-app", 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains("songs")) d.createObjectStore("songs", {keyPath:"id"});
      if(!d.objectStoreNames.contains("files")){ const f = d.createObjectStore("files", {keyPath:"id"}); f.createIndex("songId", "songId"); }
      if(!d.objectStoreNames.contains("albums")) d.createObjectStore("albums", {keyPath:"id"});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn){
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    let out;
    Promise.resolve(fn(t)).then(v => out = v);
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error("abort"));
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = store => tx(store,"readonly", t => req(t.objectStore(store).getAll()));
const dbPut = (store, v) => tx(store,"readwrite", t => req(t.objectStore(store).put(v)));
const dbDel = (store, k) => tx(store,"readwrite", t => req(t.objectStore(store).delete(k)));
const dbFilesOf = id => tx("files","readonly", t => req(t.objectStore("files").index("songId").getAll(id)));
async function dbClear(){ await tx(["songs","files","albums"],"readwrite", t => { t.objectStore("songs").clear(); t.objectStore("files").clear(); t.objectStore("albums").clear(); }); }

let songs = [];

let objectUrls = [];

let albums = [];
const KEYS = (() => { const n = ["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"]; return [...n.map(x=>x+" mayor"), ...n.map(x=>x+" menor")]; })();
async function loadSongs(){
  songs = await dbAll("songs"); albums = await dbAll("albums");
  for(const s of songs){
    let dirty = false;
    if(s.planFormats){ s.formats = [...new Set([...(s.formats||[]), ...s.planFormats])]; delete s.planFormats; dirty = true; }
    if(!s.keyMigrated){
      const t = (s.tone||"").trim();
      if(t && !KEYS.includes(t)){ s.notes = (s.notes ? s.notes + "\n" : "") + "Tono / ajustes: " + t; s.tone = ""; }
      if(s.bpm===undefined) s.bpm = "";
      s.keyMigrated = true; dirty = true;
    }
    if(dirty){ try{ await dbPut("songs", s); }catch(e){} }
  }
}
const byId = id => songs.find(s => s.id===id);
function allTags(){ const m = new Map(); songs.forEach(s => (s.tags||[]).forEach(t => m.set(t, (m.get(t)||0)+1))); return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]); }
const fold = x => (x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function uniqueValues(getVals, extra){
  const m = new Map();
  songs.forEach(s => getVals(s).forEach(v => { const k = fold(v); if(!k) return; const e = m.get(k) || {n:0, spell:new Map()}; e.n++; e.spell.set(v.trim(), (e.spell.get(v.trim())||0)+1); m.set(k,e); }));
  const out = [...m.entries()].map(([k,e]) => ({key:k, name:[...e.spell.entries()].sort((a,b)=>b[1]-a[1])[0][0], n:e.n}));
  (extra||[]).forEach(v => { if(!m.has(fold(v))) out.push({key:fold(v), name:v, n:0}); });
  return out.sort((a,b)=>b.n-a.n || a.name.localeCompare(b.name,"es"));
}
function savedList(k){ try{ const v = JSON.parse(localStorage.getItem("covers.list."+k)||"[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function rememberValue(k, v){
  v = (v||"").trim(); if(!v) return;
  const l = savedList(k); if(l.some(x => fold(x)===fold(v))) return;
  l.push(v); try{ localStorage.setItem("covers.list."+k, JSON.stringify(l)); }catch(e){}
}
const allArtists = () => uniqueValues(s => [s.artist], savedList("artists"));
const allStyleItems = () => uniqueValues(s => [s.style], [...BASE_STYLES, ...savedList("styles")]);
function canonical(items, val){ const k = fold(val); const f = items.find(i => i.key===k); return f ? f.name : val.trim(); }
function attachSuggest(input, getItems){
  const box = document.createElement("div"); box.className = "sugg hidden";
  input.parentNode.classList.add("sgwrap"); input.parentNode.appendChild(box);
  const show = () => {
    const q = fold(input.value); const items = getItems();
    let list = items.filter(i => !q || i.key.includes(q));
    list.sort((a,b) => (b.key.startsWith(q)-a.key.startsWith(q)) || b.n-a.n);
    list = list.slice(0,6);
    const exact = items.some(i => i.key===q);
    let h = list.map(i => `<button type="button" data-v="${esc(i.name)}">${esc(i.name)}${i.n?`<small>${i.n} ${i.n===1?"canción":"canciones"}</small>`:""}</button>`).join("");
    if(q && !exact) h += `<button type="button" class="new" data-v="${esc(input.value.trim())}">Crear nuevo: ${esc(input.value.trim())}</button>`;
    box.innerHTML = h; box.classList.toggle("hidden", !h);
  };
  input.addEventListener("input", show); input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(() => { box.classList.add("hidden"); const v = input.value.trim(); if(v) input.value = canonical(getItems(), v); }, 150));
  box.addEventListener("pointerdown", e => { e.preventDefault(); const b = e.target.closest("button"); if(!b) return; input.value = b.dataset.v; box.classList.add("hidden"); });
}
function allStyles(){ const set = new Set(BASE_STYLES); songs.forEach(s => s.style && set.add(s.style)); return [...set]; }

function renderChips(){
  const counts = {}; songs.forEach(s => counts[s.status] = (counts[s.status]||0)+1);
  const stale = songs.filter(isStale).length;
  const items = ["Todas", ...STATUSES, "Paradas"];
  $("#statusChips").innerHTML = items.map(s => {
    const n = s==="Todas" ? songs.length : s==="Paradas" ? stale : (counts[s]||0);
    return `<button class="chip ${ui.status===s?"on":""}" data-s="${esc(s)}">${esc(s)} ${n}</button>`;
  }).join("");
  $("#statusChips").querySelectorAll("button").forEach(b => b.onclick = () => { ui.status = b.dataset.s; renderChips(); renderList(); });
  const tags = allTags();
  $("#tagChips").innerHTML = tags.map(t => `<button class="chip tag ${ui.tag===t?"on":""}" data-t="${esc(t)}">#${esc(t)}</button>`).join("");
  $("#tagChips").classList.toggle("hidden", !tags.length);
  $("#tagChips").querySelectorAll("button").forEach(b => b.onclick = () => { ui.tag = ui.tag===b.dataset.t ? "" : b.dataset.t; renderChips(); renderList(); });
}

function filtered(){
  const q = ui.q.trim().toLowerCase();
  let list = songs.filter(s => {
    if(ui.status==="Paradas"){ if(!isStale(s)) return false; }
    else if(ui.status!=="Todas" && s.status!==ui.status) return false;
    if(ui.tag && !(s.tags||[]).includes(ui.tag)) return false;
    if(q){
      const hay = [s.title,s.artist,s.style,s.status,s.tone,s.notes,...(s.tags||[]),...(s.formats||[]),s.bpm?s.bpm+" bpm":""].join(" ").toLowerCase();
      if(!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const cmp = {
    recent:(a,b)=>b.updatedAt-a.updatedAt,
    priority:(a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority) || b.updatedAt-a.updatedAt,
    progress:(a,b)=>(b.progress||0)-(a.progress||0),
    title:(a,b)=>a.title.localeCompare(b.title,"es"),
    artist:(a,b)=>(a.artist||"").localeCompare(b.artist||"","es"),
    stale:(a,b)=>a.updatedAt-b.updatedAt,
    rating:(a,b)=>(b.rating||0)-(a.rating||0) || (!!b.liked-!!a.liked) || a.title.localeCompare(b.title,"es"),
    liked:(a,b)=>(!!b.liked-!!a.liked) || (b.rating||0)-(a.rating||0) || a.title.localeCompare(b.title,"es")
  }[ui.sort] || ((a,b)=>b.updatedAt-a.updatedAt);
  return list.sort(cmp);
}

function renderList(anim=true){
  const list = filtered();
  const main = $("#main");
  main.className = anim ? "anim" : "";
  if(!songs.length){
    main.innerHTML = `<div class="empty"><b>Aún no hay canciones</b>Pulsa el botón + para apuntar la primera.</div>`; return;
  }
  const stale = songs.filter(isStale).length;
  let html = "";
  const standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if(!standalone && lsGet("covers.tipOff","")!=="1") html += `<div class="banner" id="tipBox"><span>Para usarla como app: Compartir y "Añadir a pantalla de inicio".</span><button id="tipOk">Entendido</button></div>`;
  if(stale && ui.status!=="Paradas") html += `<div class="banner"><span>${stale} ${stale===1?"canción lleva":"canciones llevan"} más de ${staleDays()} días sin tocarse.</span><button id="seeStale">Ver</button></div>`;
  if(!list.length) html += `<div class="empty"><b>Sin resultados</b>Prueba con otra búsqueda o quita los filtros.</div>`;
  html += list.map((s,i) => {
    const pr = s.priority ? `<span class="pill pr-${esc(s.priority)}">${esc(s.priority)}</span>` : "";
    const stl = isStale(s) ? `<span class="stale-tag">Parada ${daysAgo(s.updatedAt)} d</span>` : "";
    const tags = (s.tags||[]).slice(0,3).map(t => `<span class="pill" style="font-weight:500">#${esc(t)}</span>`).join("");
    return `<div class="card ${isStale(s)?"stale":""}" data-id="${s.id}" style="border-left-color:${STATUS_COLORS[stIdx(s.status)]};--i:${Math.min(i,12)}">
      ${coverHtml(s)}
      <div class="body">
        <div class="t">${esc(s.title)}</div>
        <div class="a">${esc(s.artist||"Sin artista")}${s.style?" · "+esc(s.style):""}</div>
        <div class="meta"><span class="pill st${stIdx(s.status)}">${esc(s.status)}</span>${pr}${ratingPills(s)}${dueChip(s)}${stl}${tags}</div>
        <div class="bar"><i style="width:${Math.min(100,s.progress||0)}%"></i></div>
      </div>
      ${playBtn(s)}
      <div style="font-weight:700;color:var(--warm-ink);min-width:38px;text-align:right">${s.progress||0}%</div>
    </div>`;
  }).join("");
  main.innerHTML = html;
  main.querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
  bindPlayButtons(main, list);
  const tip = $("#tipOk"); if(tip) tip.onclick = () => { lsSet("covers.tipOff","1"); $("#tipBox").remove(); };
  const sb = $("#seeStale"); if(sb) sb.onclick = () => { ui.status = "Paradas"; renderChips(); renderList(); };
}

/* ========================= Resumen ========================= */
function renderSummary(){
  const total = songs.length;
  const open = songs.filter(s => !DONE.includes(s.status));
  const avg = open.length ? Math.round(open.reduce((a,s)=>a+(s.progress||0),0)/open.length) : 0;
  const highOpen = songs.filter(s => s.priority==="Alta" && !DONE.includes(s.status)).length;
  const stale = songs.filter(isStale);
  const byStatus = STATUSES.map(s => [s, songs.filter(x=>x.status===s).length]);
  const maxS = Math.max(1, ...byStatus.map(x=>x[1]));
  const styles = {}; songs.forEach(s => { const k = s.style||"Sin estilo"; styles[k]=(styles[k]||0)+1; });
  const styleRows = Object.entries(styles).sort((a,b)=>b[1]-a[1]);
  const maxT = Math.max(1, ...styleRows.map(x=>x[1]));
  const withFiles = songs.filter(s => (s.fileCount||0)>0).length;
  $("#main").innerHTML = `
    <div class="grid2" style="margin-top:10px">
      <div class="kpi"><b>${total}</b><span>Canciones en total</span></div>
      <div class="kpi"><b>${avg}%</b><span>Avance medio de las pendientes</span></div>
      <div class="kpi"><b>${highOpen}</b><span>De prioridad alta sin terminar</span></div>
      <div class="kpi"><b>${stale.length}</b><span>Paradas más de ${staleDays()} días</span></div>
    </div>
    <div class="panel warm"><h4>Por estado</h4>
      ${byStatus.map(([s,n]) => `<div class="hrow"><span class="l">${esc(s)}</span><span class="b"><i style="width:${n/maxS*100}%"></i></span><span class="v">${n}</span></div>`).join("")}
    </div>
    <div class="panel blue"><h4>Por estilo</h4>
      ${styleRows.length ? styleRows.map(([s,n]) => `<div class="hrow"><span class="l">${esc(s)}</span><span class="b"><i style="width:${n/maxT*100}%"></i></span><span class="v">${n}</span></div>`).join("") : '<div class="hint">Sin datos todavía.</div>'}
    </div>
    <div class="panel warm"><h4>Ideas para retomar</h4>
      ${stale.length ? stale.sort((a,b)=>a.updatedAt-b.updatedAt).slice(0,8).map(s => `<div class="hrow" style="cursor:pointer" data-id="${s.id}"><span class="l" style="width:auto;flex:1;font-weight:600">${esc(s.title)}</span><span class="hint">${daysAgo(s.updatedAt)} días</span></div>`).join("") : '<div class="hint">Nada parado. Buen ritmo.</div>'}
    </div>
    <div class="panel violet hint">Canciones con archivos guardados en la app: ${withFiles}.</div>`;
  $("#main").querySelectorAll("[data-id]").forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

function resizeImage(file, size=360){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      if(!side){ URL.revokeObjectURL(url); rej(new Error("imagen")); return; }
      const sx = (img.width-side)/2, sy = (img.height-side)/2, out = Math.min(size, side);
      const c = document.createElement("canvas"); c.width = c.height = out;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,out,out);
      g.drawImage(img, sx, sy, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen")); };
    img.src = url;
  });
}
function resizeFit(file, max=1100){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen")); };
    img.src = url;
  });
}

/* Imágenes copiadas de internet: se leen del portapapeles y se guardan dentro de la app */
async function blobFromHtmlOrText(html, text){
  let url = null;
  if(html){ const m = html.match(/<img[^>]+src=["']([^"']+)["']/i); if(m) url = m[1].replace(/&amp;/g,"&"); }
  if(!url && text){ const t = text.trim().split(/\s+/)[0]; if(/^(https?:\/\/|data:image\/)/i.test(t)) url = t; }
  if(!url) return null;
  try{ const r = await fetch(url, {mode:"cors"}); if(!r.ok) return null; const b = await r.blob(); return (b.type||"").startsWith("image/") ? b : null; }catch(e){ return null; }
}
async function imageFromDataTransfer(dt){
  if(!dt) return null;
  let file = null;
  for(const f of (dt.files||[])) if(f.type && f.type.startsWith("image/")){ file = f; break; }
  if(!file) for(const it of (dt.items||[])) if(it.kind==="file" && it.type.startsWith("image/")){ file = it.getAsFile(); break; }
  const html = dt.getData ? dt.getData("text/html") : "";
  const text = dt.getData ? (dt.getData("text/uri-list") || dt.getData("text/plain")) : "";
  if(file) return file;
  return blobFromHtmlOrText(html, text);
}
async function readClipboardImage(){
  if(!navigator.clipboard || !navigator.clipboard.read){ toast("Este navegador no deja leer el portapapeles. Usa el cuadro de pegado."); return null; }
  try{
    const items = await navigator.clipboard.read();
    for(const it of items){ const t = it.types.find(x => x.startsWith("image/")); if(t) return await it.getType(t); }
    let html = "", text = "";
    for(const it of items){
      if(it.types.includes("text/html")) html = await (await it.getType("text/html")).text();
      if(it.types.includes("text/plain")) text = await (await it.getType("text/plain")).text();
    }
    const b = await blobFromHtmlOrText(html, text);
    if(b) return b;
    toast("No hay ninguna imagen copiada. Mantén pulsada una imagen en la web y elige Copiar.");
    return null;
  }catch(err){ toast("No se pudo leer el portapapeles. Prueba con el cuadro de pegado."); return null; }
}
document.addEventListener("paste", e => {
  if(!coverSetter) return;

  if(!file) for(const it of (dt.items||[])) if(it.kind==="file" && it.type.startsWith("image/")){ file = it.getAsFile(); break; }
  if(file){ e.preventDefault(); coverSetter(file); }
});

/* ========================= Plan ========================= */
function dueInfo(s){
  if(!s.due) return null;
  const d = new Date(s.due+"T00:00:00"); if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today)/DAY);
  const label = d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
  const over = days < 0 && !DONE.includes(s.status);
  return { days, over, soon: days>=0 && days<=7, text: over ? "Venció "+label : days===0 ? "Hoy" : days===1 ? "Mañana" : label };
}
function dueChip(s){ const i = dueInfo(s); return i ? `<span class="duechip ${i.over?"over":i.soon?"soon":""}">${esc(i.text)}</span>` : ""; }
const dueSort = (a,b) => (a.due||"9999").localeCompare(b.due||"9999") || b.updatedAt-a.updatedAt;
function planCard(s, withAdv){
  const next = STATUSES[stIdx(s.status)+1];
  const canAdv = withAdv && ["Idea","Aprendiendo","Ensayando","Grabando","Grabada"].includes(s.status) && next;
  return `<div class="pcard" data-id="${s.id}" style="border-left-color:${STATUS_COLORS[stIdx(s.status)]}">
    ${coverHtml(s)}
    <div class="body">
      <div class="t">${esc(s.title)}</div>
      <div class="a">${esc(s.artist||"Sin artista")}</div>
      <div class="bar"><i style="width:${Math.min(100,s.progress||0)}%"></i></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pc">${s.progress||0}%</span>${dueChip(s)}</div>
    ${canAdv ? `<button class="adv" data-adv="${s.id}">Pasar a ${esc(next)} &rsaquo;</button>` : ""}
  </div>`;
}
function addPlanSeg(){
  const seg = `<div class="seg" id="planSeg"><button data-v="board" class="${ui.planView!=="summary"?"on":""}">Tablero</button><button data-v="summary" class="${ui.planView==="summary"?"on":""}">Resumen</button></div>`;

function albumProjects(){
  if(!albums.length) return "";
  const rows = albums.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(a => {
    const list = albumSongs(a); const n = list.length;
    const avg = n ? Math.round(list.reduce((x,t)=>x+(t.progress||0),0)/n) : 0;
    const done = list.filter(t => DONE.includes(t.status)).length;
    const idea = list.filter(t => t.status==="Idea").length;
    const next = list.filter(t => t.due && !DONE.includes(t.status)).sort((x,y)=>x.due.localeCompare(y.due))[0];
    const sub = n ? `${done} de ${n} terminadas` + (idea ? ` · ${idea} ${idea===1?"idea":"ideas"}` : "") + (next ? ` · próxima ${new Date(next.due+"T00:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})}` : "") : "Sin canciones todavía";
    const cv = a.cover ? `background-image:url('${a.cover}')` : `background:${ALBUM_COLORS[(a.color||0)%ALBUM_COLORS.length]}`;
    return `<div class="aprj" data-aprj="${esc(a.id)}"><div class="ac" style="${cv}">${a.cover?"":esc((a.name||"?").charAt(0).toUpperCase())}</div><div class="ab"><b>${esc(a.name)}</b><span>${esc(sub)}</span><div class="bar"><i style="width:${avg}%"></i></div></div><div class="ap">${avg}%</div></div>`;
  }).join("");
  return `<div class="sec-h"><h3>Álbumes en proyecto</h3><span>${albums.length}</span></div>${rows}`;
}
function renderPlan(){
  if(ui.planView==="summary"){ renderSummary(); addPlanSeg(); return; }
  if(!songs.length){ $("#main").innerHTML = `<div class="empty"><b>Tu plan está vacío</b>Añade canciones y verás aquí tu foco, tus fechas y el recorrido de cada una.</div>`; return; }
  const focus = songs.filter(s => s.focus && !DONE.includes(s.status)).sort(dueSort);
  const dated = songs.filter(s => s.due && !DONE.includes(s.status)).sort(dueSort).slice(0,8);
  const going = songs.filter(s => ["Aprendiendo","Ensayando","Grabando"].includes(s.status)).length;
  const stale = songs.filter(isStale).length;
  let h = `<div class="mini"><div class="kpi"><b>${focus.length}</b><span>Trabajando</span></div><div class="kpi"><b>${going}</b><span>En marcha</span></div><div class="kpi"><b>${stale}</b><span>Paradas</span></div></div>`;
  h += albumProjects();
  h += `<div class="sec-h"><h3>Trabajando ahora</h3><span>${focus.length}</span></div>`;
  h += focus.length ? focus.map(s => planCard(s,true)).join("") : `<div class="panel warm hint">Marca una canción como "Trabajando ahora" al editarla y aparecerá aquí, ordenada por fecha.</div>`;
  h += `<div class="sec-h"><h3>Próximas fechas</h3><span>${dated.length}</span></div>`;
  h += dated.length ? dated.map(s => planCard(s,false)).join("") : `<div class="panel warm hint">Pon una fecha objetivo a una canción para verla aquí.</div>`;
  h += `<div class="sec-h"><h3>Recorrido</h3><span>desliza para ver cada fase</span></div><div class="board">`;
  const colColors = ["#fff0a0","#ffe270","#ffd24d","#ffc23d","#8fd9a8","#5cc487","#c9c7e6"];
  STATUSES.forEach((st,i) => {
    const list = songs.filter(s => s.status===st).sort((a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority) || b.updatedAt-a.updatedAt);
    h += `<div class="col"><h4><span>${esc(st)}</span><span class="cnt" style="background:${colColors[i]};color:#4a3200">${list.length}</span></h4>${list.length ? list.map(s=>planCard(s,true)).join("") : '<div class="empty-col">Nada por aquí</div>'}</div>`;
  });
  h += `</div>`;
  $("#main").innerHTML = h;
  addPlanSeg();
  $("#main").querySelectorAll(".pcard").forEach(c => c.onclick = () => openDetail(c.dataset.id));
  $("#main").querySelectorAll("[data-aprj]").forEach(c => c.onclick = () => openAlbum(c.dataset.aprj));
  $("#main").querySelectorAll("[data-adv]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const s = byId(b.dataset.adv); if(!s) return;
    s.status = STATUSES[stIdx(s.status)+1]; s.updatedAt = Date.now();
    try{ await dbPut("songs", s); await loadSongs(); renderPlan(); toast(`"${s.title}" pasa a ${s.status}.`); }catch(err){ toast("No se pudo actualizar."); }
  });
}

const AUD = $("#aud");
const PL = { ids:[], order:[], pos:-1, shuffle:false, repeat:0, url:null, token:0, unlocked:false, seeking:false, skips:0 };
const fmtTime = t => { if(!isFinite(t)||t<0) t = 0; t = Math.floor(t); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
const curId = () => PL.order.length ? PL.ids[PL.order[PL.pos]] : null;
function silentWavUrl(){
  const n = 800, b = new ArrayBuffer(44+n*2), v = new DataView(b);
  const w = (o,t) => { for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVEfmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
function unlockAudio(){
  if(PL.unlocked) return; PL.unlocked = true;
  try{ AUD.src = silentWavUrl(); const p = AUD.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
}
function buildOrder(first){
  const idx = PL.ids.map((_,i)=>i);
  if(PL.shuffle){
    for(let i=idx.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
    const k = idx.indexOf(first); if(k>0){ idx.splice(k,1); idx.unshift(first); }
  }
  PL.order = idx; PL.pos = PL.order.indexOf(first);
}
function playList(ids, startId, shuffle){
  const valid = ids.filter(i => { const s = byId(i); return s && s.hasTrack; });
  if(!valid.length){ toast("Ninguna canción de esta lista tiene audio. Añade el mp3 en la ficha."); return; }
  unlockAudio();
  if(shuffle!==null && shuffle!==undefined) PL.shuffle = shuffle;
  PL.ids = valid;
  let first = startId ? valid.indexOf(startId) : (PL.shuffle ? Math.floor(Math.random()*valid.length) : 0);
  if(first<0) first = 0;
  buildOrder(first); PL.skips = 0;
  loadCurrent(true);
}
async function loadCurrent(autoplay){
  const id = curId(); if(!id) return; const s = byId(id); const token = ++PL.token;
  showMini(); updatePlayerUi();
  let tr = null;
  try{ tr = (await dbFilesOf(id)).find(f => f.role==="track"); }catch(e){}
  if(token!==PL.token) return;
  if(!tr){
    toast("No encuentro el audio de «" + (s?s.title:"") + "».");
    if(++PL.skips < PL.ids.length) step(1, true); else { AUD.pause(); updatePlayerUi(); }
    return;
  }
  PL.skips = 0;
  if(PL.url) URL.revokeObjectURL(PL.url);
  PL.url = URL.createObjectURL(tr.blob); AUD.src = PL.url;
  if(autoplay){ const p = AUD.play(); if(p && p.catch) p.catch(() => { toast("Pulsa play para reproducir."); updatePlayerUi(); }); }
  setMediaSession(s); updatePlayerUi();
}
function step(dir, auto){
  const n = PL.order.length; if(!n) return;
  if(auto && PL.repeat===2){ AUD.currentTime = 0; AUD.play().catch(()=>{}); return; }
  let p = PL.pos + dir;
  if(p>=n){ if(PL.repeat===1 || !auto) p = 0; else { AUD.pause(); AUD.currentTime = 0; updatePlayerUi(); return; } }
  if(p<0) p = n-1;
  PL.pos = p; loadCurrent(true);
}
function togglePlay(){ if(!AUD.src || !curId()) return; if(AUD.paused) AUD.play().catch(()=>{}); else AUD.pause(); }
function prevTrack(){ if(AUD.currentTime>3){ AUD.currentTime = 0; } else step(-1,false); }
function toggleShuffle(){
  PL.shuffle = !PL.shuffle; const cur = PL.order.length ? PL.order[PL.pos] : 0;
  buildOrder(cur); updatePlayerUi();
}
function toggleRepeat(){ PL.repeat = (PL.repeat+1)%3; updatePlayerUi(); }
function setMediaSession(s){
  if(!("mediaSession" in navigator) || !s) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({ title:s.title, artist:s.artist||"", album:"Mis covers", artwork: s.cover ? [{src:s.cover, sizes:"360x360", type:"image/jpeg"}] : [] });
    const h = (a,f) => { try{ navigator.mediaSession.setActionHandler(a,f); }catch(e){} };
    h("play", () => AUD.play().catch(()=>{})); h("pause", () => AUD.pause());
    h("previoustrack", prevTrack); h("nexttrack", () => step(1,false));
    h("seekto", d => { if(d.seekTime!=null) AUD.currentTime = d.seekTime; });
  }catch(e){}
}
function showMini(){ $("#mini").classList.remove("hidden"); document.body.classList.add("hasmini"); }
function coverStyle(s){ return s && s.cover ? `background-image:url('${s.cover}')` : `background:${colorFor(s?s.title:"?")}`; }
function initials(s){ return s && !s.cover ? esc((s.title||"?").trim().charAt(0).toUpperCase()) : ""; }
function updateProgressUi(){

  $("#mBar").style.width = pct+"%";

}

/* ========================= Álbumes ========================= */
const ALBUM_COLORS = ["#e3f1ff","#f1e9ff","#fff4de","#ffe6dc","#dff5e8","#ffe3f0"];
const norm = x => (x||"").trim().toLowerCase();
function albumSongs(a){
  if(a.kind==="manual"){ const set = new Set(a.songIds||[]); return songs.filter(s => set.has(s.id)); }
  if(a.kind==="artist") return songs.filter(s => norm(s.artist)===norm(a.value));
  if(a.kind==="style") return songs.filter(s => norm(s.style)===norm(a.value));
  if(a.kind==="tag") return songs.filter(s => (s.tags||[]).includes(a.value));
  return [];
}
function virtualAlbums(kind){
  const m = new Map();
  songs.forEach(s => {
    const vals = kind==="tag" ? (s.tags||[]) : [kind==="artist" ? s.artist : s.style];
    vals.forEach(v => { const k = norm(v); if(!k) return; const e = m.get(k) || {name:v.trim(), n:0}; e.n++; m.set(k,e); });
  });
  return [...m.values()].sort((a,b)=>b.n-a.n || a.name.localeCompare(b.name,"es")).map((e,i) => ({ id:"v:"+kind+":"+e.name, virtual:true, kind, value:e.name, name:e.name, color:i%ALBUM_COLORS.length }));
}
function albumById(id){
  if(id.startsWith("v:")){ const parts = id.split(":"); const kind = parts[1]; const value = parts.slice(2).join(":"); return {id, virtual:true, kind, value, name:value, color:0}; }
  return albums.find(a => a.id===id);
}
function tileHtml(a){
  const list = albumSongs(a);
  const avg = list.length ? Math.round(list.reduce((x,s)=>x+(s.progress||0),0)/list.length) : 0;
  const cells = [0,1,2,3].map(i => {
    const s = list[i];
    if(!s) return `<div class="m" style="background:rgba(255,255,255,.5)"></div>`;
    return s.cover ? `<div class="m" style="background-image:url('${s.cover}')"></div>` : `<div class="m" style="background:${colorFor(s.title)}">${esc((s.title||"?").charAt(0).toUpperCase())}</div>`;
  }).join("");
  const mos = a.cover ? `<div class="mosaic one" style="background-image:url('${a.cover}')"></div>` : `<div class="mosaic">${cells}</div>`;
  return `<div class="tile" data-aid="${esc(a.id)}" style="background:${ALBUM_COLORS[(a.color||0)%ALBUM_COLORS.length]}">${mos}<div class="nm">${esc(a.name)}</div><div class="ct">${list.length} ${list.length===1?"canción":"canciones"} · ${avg}%</div></div>`;
}
function renderAlbums(){
  if(!songs.length && !albums.length){ $("#main").innerHTML = `<div class="empty"><b>Aún no hay álbumes</b>Añade canciones y se agruparán solas por artista, estilo y etiqueta. También puedes crear los tuyos con el botón +.</div>`; return; }
  let h = `<div class="sec-h"><h3>Mis álbumes</h3><span>${albums.length}</span></div>`;
  h += albums.length ? `<div class="agrid">${albums.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(tileHtml).join("")}</div>` : `<div class="panel blue hint">Crea álbumes con el botón + para agrupar canciones a mano o de forma automática por artista, estilo o etiqueta.</div>`;
  [["artist","Por artista"],["style","Por estilo"],["tag","Por etiqueta"]].forEach(([k,t]) => {
    const v = virtualAlbums(k); if(!v.length) return;
    h += `<div class="sec-h"><h3>${t}</h3><span>${v.length}</span></div><div class="hscroll">${v.map(tileHtml).join("")}</div>`;
  });
  $("#main").innerHTML = h;
  $("#main").querySelectorAll(".tile").forEach(t => t.onclick = () => openAlbum(t.dataset.aid));
}
function trackRowHtml(s, i, nowId){
  const cov = s.cover ? `background-image:url('${s.cover}')` : `background:${colorFor(s.title)}`;
  return `<div class="trk ${s.id===nowId?"now":""}" data-id="${s.id}"><span class="tn">${i+1}</span><span class="tc" style="${cov}">${s.cover?"":esc((s.title||"?").charAt(0).toUpperCase())}</span><span class="tt"><b>${esc(s.title)}</b><span>${esc(s.artist||"Sin artista")} · ${esc(s.status)} · ${s.progress||0}%</span></span><span class="dot" style="background:${STATUS_COLORS[stIdx(s.status)]}" title="${esc(s.status)}"></span>${ratingPills(s)}${playBtn(s)}</div>`;

  };
  const setCover = async blob => { try{ a.cover = await resizeImage(blob, 480); drawCover(); toast("Portada guardada en la app."); }catch(e){ toast("No se pudo leer esa imagen."); } };
  const addPhoto = async blob => { try{ a.photos.push(await resizeFit(blob)); drawGal(); toast("Foto guardada en la app."); }catch(e){ toast("No se pudo leer esa imagen."); } };
  coverSetter = addPhoto;
  $("#alCovPaste").onclick = async () => { const b = await readClipboardImage(); if(b) await setCover(b); };
  $("#alPhPaste").onclick = async () => { const b = await readClipboardImage(); if(b) await addPhoto(b); };
  $("#alCovPick").onclick = () => $("#alCovFile").click();
  $("#alPhPick").onclick = () => $("#alPhFile").click();
  $("#alCovFile").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if(f) await setCover(f); };
  $("#alPhFile").onchange = async e => { const fs = [...e.target.files]; e.target.value = ""; for(const f of fs) await addPhoto(f); };
  $("#alCovDel").onclick = () => { a.cover = null; drawCover(); };
  const az = $("#alPasteZone");
  az.addEventListener("paste", async e => { e.preventDefault(); e.stopPropagation(); const b = await imageFromDataTransfer(e.clipboardData); az.innerHTML = ""; if(b) await addPhoto(b); else toast("No he encontrado una imagen. Copia la imagen, no el enlace de la página."); });
  az.addEventListener("input", () => { az.innerHTML = ""; });
  az.addEventListener("keydown", e => { if(!(e.metaKey || e.ctrlKey)) e.preventDefault(); });
  drawCover(); drawGal();
  $("#alCancel").onclick = () => closeLayer();
  const del = $("#alDel");
  if(del) del.onclick = async () => {
    if(!confirm("¿Eliminar este álbum? Las canciones no se borran.")) return;
    try{ await dbDel("albums", a.id); await loadSongs(); closeLayer(); render(); toast("Álbum eliminado."); }catch(err){ toast("No se pudo eliminar."); }
  };
  $("#alSave").onclick = async () => {
    let name = $("#alName").value.trim();
    if(a.kind!=="manual"){ if(!a.value){ toast("Elige un valor para el álbum automático."); return; } if(!name) name = a.value; }
    if(!name){ toast("Escribe el nombre del álbum."); $("#alName").focus(); return; }
    a.name = name; a.songIds = a.kind==="manual" ? [...sel] : [];
    try{ await dbPut("albums", a); await loadSongs(); closeLayer(); render(); toast("Álbum guardado."); }catch(err){ toast("No se pudo guardar."); }
  };
  if(isNew) $("#alName").focus();
}

/* ========================= Ajustes y copias ========================= */
async function renderSettings(){
  let usage = "";
  try{ if(navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); usage = `Espacio usado por la app: ${fmtSize(e.usage||0)} de ${fmtSize(e.quota||0)} disponibles.`; } }catch(e){}
  const cred = currentCred();
  $("#main").innerHTML = `
    <div class="panel"><h4>Copia de seguridad</h4>
      <p class="hint">Guarda todo en un archivo para no perderlo si cambias de móvil o borras los datos del navegador.</p>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0"><input type="checkbox" id="sFiles" checked> Incluir mp3, mp4 y portadas (el archivo puede ser grande)</label>
      <button class="btn" id="sExport">Exportar copia</button>
      <button class="btn soft" id="sImport" style="margin-left:6px">Importar copia</button>
      <input type="file" id="sImportFile" accept=".json,application/json" class="hidden">
      <p class="hint" style="margin-bottom:0">${esc(usage)}</p>
    </div>
    <div class="panel"><h4>Ideas paradas</h4>
      <p class="hint">Días sin tocar una canción antes de avisarte.</p>
      <input class="in" type="number" min="1" max="365" id="sStale" value="${staleDays()}" style="max-width:120px">
    </div>
    <div class="panel"><h4>Acceso</h4>
      <p class="hint">Usuario actual: <b>${esc(cred.user)}</b>. Es un bloqueo de pantalla para esta app en este dispositivo.</p>
      <label class="f">Nuevo usuario</label><input class="in" id="sNewUser" value="${esc(cred.user)}" autocapitalize="none" autocomplete="off">
      <label class="f">Contraseña actual</label><input class="in" type="password" id="sOldPass" autocomplete="off">
      <label class="f">Nueva contraseña</label><input class="in" type="password" id="sNewPass" autocomplete="new-password">
      <div style="margin-top:12px"><button class="btn" id="sChange">Cambiar acceso</button>
      <button class="btn soft" id="sLock" style="margin-left:6px">Bloquear ahora</button></div>
    </div>
    <div class="panel"><h4>Instalar en el iPhone</h4>
      <p class="hint" style="margin:0">En Safari pulsa Compartir y después "Añadir a pantalla de inicio". Se abrirá como una app, también sin conexión.</p>
    </div>
    <div class="panel"><h4>Zona de peligro</h4>
      <button class="btn danger" id="sWipe" style="padding-left:0">Borrar todos los datos de la app</button>
    </div>`;
  $("#sStale").onchange = e => { const n = parseInt(e.target.value,10); if(n>0){ lsSet("covers.staleDays", String(n)); toast("Guardado."); } };
  $("#sLock").onclick = lockNow;
  $("#sChange").onclick = async () => {
    const nu = $("#sNewUser").value.trim(), op = $("#sOldPass").value, np = $("#sNewPass").value;
    const cur = currentCred();
    if(!nu || !np){ toast("Indica usuario y nueva contraseña."); return; }
    if(np.length < 4){ toast("La contraseña debe tener al menos 4 caracteres."); return; }
    if((await hashCred(cur.user, op)) !== cur.hash){ toast("La contraseña actual no es correcta."); return; }
    lsSet("covers.user", nu); lsSet("covers.hash", await hashCred(nu, np));
    toast("Acceso actualizado."); renderSettings();
  };
  $("#sExport").onclick = () => exportBackup($("#sFiles").checked);
  $("#sImport").onclick = () => $("#sImportFile").click();
  $("#sImportFile").onchange = e => { const f = e.target.files[0]; if(f) importBackup(f); e.target.value = ""; };
  $("#sWipe").onclick = async () => {
    if(!confirm("Se borrarán todas las canciones y archivos de este dispositivo. ¿Continuar?")) return;
    if(!confirm("Última comprobación: ¿has hecho una copia de seguridad?")) return;
    await dbClear(); await loadSongs(); render(); toast("Datos borrados.");
  };
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function exportBackup(withFiles){
  try{
    toast("Preparando copia...");
    const out = { app:"mis-covers", version:2, exportedAt:new Date().toISOString(), songs, albums, lists:{artists:savedList("artists"), styles:savedList("styles")}, files:[] };
    if(withFiles){
      for(const f of await dbAll("files")) out.files.push({ id:f.id, songId:f.songId, name:f.name, type:f.type, size:f.size, addedAt:f.addedAt, data: await blobToDataUrl(f.blob) });
    } else { out.songs = songs.map(s => ({...s, fileCount:0, hasTrack:false})); }
    const blob = new Blob([JSON.stringify(out)], {type:"application/json"});
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `mis-covers-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
    toast("Copia lista. Revisa tus descargas o la app Archivos.");
  }catch(err){ console.error(err); toast("No se pudo crear la copia (puede ser demasiado grande). Prueba sin archivos."); }
}
async function importBackup(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app!=="mis-covers" || !Array.isArray(data.songs)) throw new Error("formato");
    if(!confirm(`Se importarán ${data.songs.length} canciones. Las que tengan el mismo identificador se sobrescribirán. ¿Continuar?`)) return;
    for(const s of data.songs) await dbPut("songs", s);
    for(const al of (data.albums||[])) await dbPut("albums", al);
    if(data.lists){ (data.lists.artists||[]).forEach(v => rememberValue("artists", v)); (data.lists.styles||[]).forEach(v => rememberValue("styles", v)); }
    songs.forEach(()=>{}); data.songs.forEach(x => { rememberValue("artists", x.artist); rememberValue("styles", x.style); });
    for(const f of (data.files||[])){
      const blob = await (await fetch(f.data)).blob();
      await dbPut("files", { id:f.id, songId:f.songId, name:f.name, type:f.type, size:f.size, addedAt:f.addedAt, blob });
    }
    await loadSongs(); render(); toast("Copia importada.");
  }catch(err){ console.error(err); toast("No se pudo importar ese archivo."); }
}

/* ========================= Inicio ========================= */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
if(isUnlocked()) { $("#lock").classList.add("hidden"); startApp(); } else { showLock(); }
</script>
